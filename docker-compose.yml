services:
  ollama:
    image: ollama/ollama:latest
    container_name: chatwithpdf-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chatwithpdf

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chatwithpdf-backend:latest
    container_name: chatwithpdf-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - backend-instance:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - chatwithpdf

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chatwithpdf-frontend:latest
    container_name: chatwithpdf-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - chatwithpdf

volumes:
  ollama-data:
  backend-instance:

networks:
  chatwithpdf:
    driver: bridge
